<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Clone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Left Sidebar -->
        <div class="sidebar">

            <div class="sidebar-header">
                <h2>WhatsApp</h2>
            </div>

            <div class="search">
                <input type="text" placeholder="Search or start new chat">
            </div>

            <div class="contact" onclick="openChat('Ali')">
                <div class="avatar">A</div>
                <div>
                    <h3>Ali</h3>
                    <p>Hello!</p>
                </div>
            </div>

            <div class="contact" onclick="openChat('Hassan')">
                <div class="avatar">H</div>
                <div>
                    <h3>Hassan</h3>
                    <p>How are you?</p>
                </div>
            </div>

            <div class="contact" onclick="openChat('Noor')">
                <div class="avatar">N</div>
                <div>
                    <h3>Noor</h3>
                    <p>Good morning</p>
                </div>
            </div>

        </div>


        <!-- Chat Area -->
        <div class="chat">

            <div class="chat-header">
                <div class="avatar">A</div>
                <div>
                    <h3 id="chatName">Ali</h3>
                    <p>online</p>
                </div>
            </div>

            <div class="messages" id="messages">
                <div class="message received">
                    Hello 👋
                </div>

                <div class="message sent">
                    Hi! How are you?
                </div>
            </div>

            <div class="message-box">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type a message"
                >

                <button id="sendButton">
                    Send
                </button>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
